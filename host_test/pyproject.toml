[project]
name = "footswitch-hid-host-tools"
version = "0.0.2"
description = "footswitch_hid 主机侧工具(在线改键 / 诊断)"
requires-python = ">=3.9"
# hidapi 只在 Windows / macOS 需要;Linux 上 pedalctl.py 会回退到 /dev/hidraw ioctl
dependencies = [
  "hidapi>=0.14.0; sys_platform == 'win32'",
]

[tool.uv]
package = false
